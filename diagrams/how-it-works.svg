<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="ui-sans-serif, system-ui, 'Segoe UI', Arial, sans-serif" viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ht htd">
<rect x="0" y="0" width="100%" height="100%" fill="#f4f7fb"/>
<title id="ht">How the PowerScale Admin Assistant works</title>
<desc id="htd">Four steps: you ask in plain language; it looks the answer up in Dell's official documentation; a small AI running on the cluster explains it in plain English; you get a clear answer with its sources. Grounded in Dell's docs, runs on the cluster, always cited.</desc>
<defs><marker id="hw" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6 Z" fill="#b9c6d4"/></marker></defs>

<text x="40" y="52" font-size="25" font-weight="800" fill="#17212e">How the assistant works — in four steps</text>
<text x="40" y="82" font-size="14.5" fill="#5c6a7a">Ask in plain language. Get a clear, cited answer — without anything leaving the cluster.</text>

<!-- step cards -->
<g>
<rect x="28" y="128" width="210" height="212" rx="12" fill="#ffffff" stroke="#b9c6d4" stroke-width="1.5"/>
<circle cx="56" cy="156" r="18" fill="#0076CE"/><text x="56" y="161" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text>
<text x="133" y="212" text-anchor="middle" font-size="40">💬</text>
<text x="133" y="258" text-anchor="middle" font-size="17" font-weight="700" fill="#17212e">You ask</text>
<text x="133" y="283" text-anchor="middle" font-size="12.5" fill="#5c6a7a">a question, in</text>
<text x="133" y="300" text-anchor="middle" font-size="12.5" fill="#5c6a7a">plain language</text>
</g>
<g>
<rect x="273" y="128" width="210" height="212" rx="12" fill="#ffffff" stroke="#b9c6d4" stroke-width="1.5"/>
<circle cx="301" cy="156" r="18" fill="#0076CE"/><text x="301" y="161" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text>
<text x="378" y="212" text-anchor="middle" font-size="40">📚</text>
<text x="378" y="258" text-anchor="middle" font-size="17" font-weight="700" fill="#17212e">It looks it up</text>
<text x="378" y="283" text-anchor="middle" font-size="12.5" fill="#5c6a7a">in Dell's official</text>
<text x="378" y="300" text-anchor="middle" font-size="12.5" fill="#5c6a7a">documentation</text>
</g>
<g>
<rect x="518" y="128" width="210" height="212" rx="12" fill="#ffffff" stroke="#b9c6d4" stroke-width="1.5"/>
<circle cx="546" cy="156" r="18" fill="#0076CE"/><text x="546" y="161" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text>
<text x="623" y="212" text-anchor="middle" font-size="40">✨</text>
<text x="623" y="258" text-anchor="middle" font-size="17" font-weight="700" fill="#17212e">AI explains it</text>
<text x="623" y="283" text-anchor="middle" font-size="12.5" fill="#5c6a7a">a small AI runs</text>
<text x="623" y="300" text-anchor="middle" font-size="12.5" fill="#5c6a7a">on the cluster</text>
</g>
<g>
<rect x="763" y="128" width="210" height="212" rx="12" fill="#ffffff" stroke="#0f7a5c" stroke-width="1.8"/>
<circle cx="791" cy="156" r="18" fill="#0f7a5c"/><text x="791" y="161" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">4</text>
<text x="868" y="212" text-anchor="middle" font-size="40">✅</text>
<text x="868" y="258" text-anchor="middle" font-size="17" font-weight="700" fill="#17212e">You get the answer</text>
<text x="868" y="283" text-anchor="middle" font-size="12.5" fill="#5c6a7a">clear — and with</text>
<text x="868" y="300" text-anchor="middle" font-size="12.5" fill="#5c6a7a">its sources</text>
</g>

<!-- arrows -->
<g stroke="#b9c6d4" stroke-width="2.5" fill="none">
<line x1="244" y1="234" x2="267" y2="234" marker-end="url(#hw)"/>
<line x1="489" y1="234" x2="512" y2="234" marker-end="url(#hw)"/>
<line x1="734" y1="234" x2="757" y2="234" marker-end="url(#hw)"/>
</g>

<!-- promises band -->
<rect x="28" y="398" width="945" height="104" rx="14" fill="#eef3f9"/>
<rect x="150" y="430" width="216" height="42" rx="21" fill="#e3f6ef"/>
<text x="258" y="456" text-anchor="middle" font-size="14" font-weight="700" fill="#0f7a5c">Grounded in Dell's docs</text>
<rect x="386" y="430" width="330" height="42" rx="21" fill="#e7f2fc"/>
<text x="551" y="456" text-anchor="middle" font-size="14" font-weight="700" fill="#0076CE">Runs on the cluster — nothing leaves</text>
<rect x="736" y="430" width="140" height="42" rx="21" fill="#e3f6ef"/>
<text x="806" y="456" text-anchor="middle" font-size="14" font-weight="700" fill="#0f7a5c">Always cited</text>
</svg>
